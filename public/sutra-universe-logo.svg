<svg width="280" height="64" viewBox="0 0 280 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="suFullViolet" x1="6" y1="6" x2="58" y2="58" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#4F46E5"/>
      <stop offset="50%" stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#C026D3"/>
    </linearGradient>

    <linearGradient id="suFullCyanGold" x1="10" y1="18" x2="56" y2="50" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#06B6D4"/>
      <stop offset="55%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>

    <linearGradient id="suFullPulsar" x1="28" y1="26" x2="36" y2="38" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FEF08A"/>
      <stop offset="50%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>

    <linearGradient id="suTextGrad" x1="140" y1="18" x2="260" y2="40" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#4F46E5"/>
      <stop offset="50%" stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#C026D3"/>
    </linearGradient>
  </defs>

  <!-- ICON GLYPH ON LEFT -->
  <g>
    <!-- Orbit Ellipse 1 (Cyan-Blue) -->
    <ellipse cx="32" cy="32" rx="26" ry="11.5" transform="rotate(-35 32 32)" stroke="url(#suFullCyanGold)" stroke-width="3.2" stroke-linecap="round" fill="none" stroke-dasharray="92 24"/>

    <!-- Orbiting Satellite Node -->
    <circle cx="50.5" cy="19" r="3.2" fill="#F59E0B"/>

    <!-- Orbit Ellipse 2 (Violet-Magenta) -->
    <ellipse cx="32" cy="32" rx="26" ry="11.5" transform="rotate(35 32 32)" stroke="url(#suFullViolet)" stroke-width="3.2" stroke-linecap="round" fill="none"/>

    <!-- Central Sutra Möbius / S-Nexus Core Ribbon -->
    <path d="M25 20.5 C33 20.5 39 24 39 28.5 C39 34 25 31 25 36.5 C25 41.5 31 44.5 39 44.5" stroke="url(#suFullViolet)" stroke-width="4.8" stroke-linecap="round" fill="none"/>

    <!-- Central Pulsar Star -->
    <path d="M32 25.5 L33.4 30.2 L38 32 L33.4 33.8 L32 38.5 L30.6 33.8 L26 32 L30.6 30.2 Z" fill="url(#suFullPulsar)"/>
    <circle cx="32" cy="32" r="1.6" fill="#FFFFFF"/>
  </g>

  <!-- TYPOGRAPHY ON RIGHT -->
  <text x="72" y="35" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="24" font-weight="900" letter-spacing="-0.04em" fill="#0F172A">
    SUTRA<tspan fill="url(#suTextGrad)">UNIVERSE</tspan>
  </text>

  <text x="73" y="49" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="9.5" font-weight="800" letter-spacing="0.16em" fill="#6366F1">
    MASTER ECOSYSTEM HUB
  </text>
</svg>
