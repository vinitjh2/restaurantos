[package]
name = "restaurantos-desktop"
version = "1.0.0"
description = "RestaurantOS Enterprise POS, KDS and Indian GST Billing Platform"
authors = ["RestaurantOS Team"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "1.5", features = [] }

[dependencies]
tauri = { version = "1.5", features = [ "api-all", "shell-open", "window-all" ] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.28", features = ["full"] }

[target.'cfg(windows)'.dependencies]
winapi = { version = "0.3.9", features = [
    "winspool",
    "wingdi",
    "winuser",
    "minwindef",
    "winbase",
    "winerror"
] }

[features]
# By default we include custom-protocol for production builds
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
